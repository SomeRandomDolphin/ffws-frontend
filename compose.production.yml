name: ffws

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PREDICTOR_BACKEND: file
    volumes:
      - backend_artifacts:/app/artifacts
      - ../backend/configs/surabaya/database.local.yaml:/app/configs/surabaya/database.local.yaml:ro
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/surabaya/snapshot', timeout=5)"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      SURABAYA_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FFWS_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

volumes:
  backend_artifacts:
